version: '3.8'


services:
  thingdboard:
    image: thingsboard/tb-postgres
    restart: always
    ports:
      - "8080:9090" #web
      - "1883:1883" #mqtt
      - "7070:7070" #edge
      - "5683-5688:5683-5688" #coap
    environment:
      TB_QUEUE_TYPE: in-memory
    volumes:
      - ~/.mytb-data:/data
      - ~/.mytb-logs:/var/log/thingsboard

volumes:
  mytb-data:
  mytb-logs:
